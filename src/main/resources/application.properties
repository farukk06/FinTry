spring.application.name=FinTry
spring.datasource.url=${FINTRY_DB_URL}
spring.datasource.username=${FINTRY_DB_USERNAME}
spring.datasource.password=${FINTRY_DB_PASSWORD}
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.jpa.show-sql=false
# Exception handlers run after Hibernate has seen JDBC errors. Suppress value-bearing lower-level logs too.
spring.jpa.properties.hibernate.jdbc.log.errors=false
spring.jpa.properties.hibernate.jdbc.log.warnings=false
logging.level.org.hibernate.orm.jdbc=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.postgresql=OFF
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.port=8080
server.forward-headers-strategy=NONE
fintry.security.jwt.private-key=${FINTRY_JWT_PRIVATE_KEY}
fintry.security.jwt.public-key=${FINTRY_JWT_PUBLIC_KEY}
fintry.security.jwt.issuer=fintry
fintry.security.jwt.audience=fintry-web
fintry.security.jwt.ttl=PT15M
fintry.security.allowed-origins=${FINTRY_FRONTEND_ORIGINS:http://localhost:5173}
fintry.security.trusted-proxies=${FINTRY_TRUSTED_PROXIES:}
